[build-system]
requires = ["setuptools>=68,<76", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otoevi"
version = "1.0.0"
description = "Local evidence-guided otoendoscopic report generation with Clause Coverage Learning"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8,<3.12"
# Pin the direct research dependencies to the validated experiment environment.
dependencies = [
    "torch==2.3.1",
    "torchvision==0.18.1",
    "timm==1.0.27",
    "safetensors==0.5.3",
    "numpy==1.24.4",
    "Pillow==10.4.0",
]

[project.optional-dependencies]
eval = ["pycocoevalcap==1.2"]
dev = ["ruff==0.9.10", "build==1.2.2.post1"]

[project.scripts]
otoevi-train = "otoevi.cli.train:main"
otoevi-predict = "otoevi.cli.predict:main"
otoevi-evaluate = "otoevi.cli.evaluate:main"

[project.urls]
Repository = "https://github.com/lululualululu/OtoEvi"

[tool.setuptools.packages.find]
where = ["src"]
include = ["otoevi*"]
namespaces = false

[tool.ruff]
target-version = "py38"
line-length = 88
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
