name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    # Keep Python 3.8 available for the pinned experiment dependencies.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[eval,dev]'
      - run: python -m unittest discover -s tests/unit -v
      - run: python scripts/check_results.py
      - run: python -m ruff check src tests scripts
      - run: python -m build
